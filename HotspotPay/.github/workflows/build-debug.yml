name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare project sources
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip archive: $ZIP_FILE. Unzipping..."
            unzip -o "$ZIP_FILE"
          else
            echo "No zip archive detected; building from existing source tree."
          fi

      - name: Build debug APK
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Error: Could not locate settings.gradle in the repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Found Android project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Ensure gradlew executable and wrapper are present
          if [ ! -f "./gradlew" ]; then
            if [ -f "../gradlew" ]; then
              cp ../gradlew ./
              cp -r ../gradle ./
            else
              echo "Creating Gradle 8.7 wrapper..."
              gradle wrapper --gradle-version 8.7 --distribution-type bin
            fi
          fi

          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
